# Fly.io config for the x402 v3 service.
# Region iad is the cheapest; shared-cpu-1x 256MB always-on is $2.19/mo,
# under Fly.io's under-$5 bill waiver.
app = "manteclaw-x402"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    name = "health"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  AWS_SCHEME_ENABLED = "1"

# Quote-signing private key for AWS Agentic Commerce: the Fly secret
# AWS_QUOTE_KEY_PEM holds the base64-encoded PEM; Fly decodes it and
# writes it here at boot. The key itself never enters git or the image.
[[files]]
  guest_path = "/app/aws-quote-key.pem"
  secret_name = "AWS_QUOTE_KEY_PEM"
