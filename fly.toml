# Fly.io config for the x402 v3 service.
# Region iad is the cheapest; shared-cpu-1x 256MB always-on is $2.19/mo,
# under Fly.io's under-$5 bill waiver.
app = "manteclaw-x402"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    name = "health"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
